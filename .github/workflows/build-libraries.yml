name: V2 libraries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            cmake_args: ""
          - os: windows-2022
            artifact: windows-x86_64
            cmake_args: "-A x64"
          - os: macos-15
            artifact: macos-universal-arm64-test
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
          - os: macos-15-intel
            artifact: macos-universal-intel-test
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        env:
          N148I_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: >-
          cmake -S . -B cmake-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/builds/${{ matrix.artifact }}"
          ${N148I_CMAKE_ARGS}

      - name: Build
        run: cmake --build cmake-build --config Release --parallel

      - name: Test public API
        run: ctest --test-dir cmake-build -C Release --output-on-failure

      - name: Install
        run: cmake --install cmake-build --config Release

      - name: Configure installed library consumers
        shell: bash
        env:
          N148I_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: >-
          cmake -S examples -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/builds/${{ matrix.artifact }}"
          ${N148I_CMAKE_ARGS}

      - name: Build installed library consumers
        run: cmake --build consumer-build --config Release --parallel

      - name: Test installed shared and static libraries
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/builds/${{ matrix.artifact }}/bin:$PATH"
          ctest --test-dir consumer-build -C Release --output-on-failure

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: n148i-V2-${{ matrix.artifact }}
          path: builds/${{ matrix.artifact }}
          if-no-files-found: error
